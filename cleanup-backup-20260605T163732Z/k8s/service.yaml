apiVersion: v1
kind: Service
metadata:
  name: feedback-agent-service
  namespace: __K8S_NAMESPACE__
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default":"feedback-agent-backendconfig"}'
spec:
  type: NodePort
  selector:
    app: feedback-agent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
