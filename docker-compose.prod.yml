# One droplet, two environments. Both run the same image; only the env file
# and the database behind it differ.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Interim only, for Caddyfile.ip before DNS exists. Harmless once the
      # hostname config is in use — nothing listens on 8080 then.
      - "8080:8080"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates — losing these forces re-issue
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - prod
      - uat

  prod:
    image: ${APP_IMAGE}
    restart: always
    env_file: [.env.prod]
    # The Gmail service-account key lives on the host beside the env files and
    # is mounted read-only. Deliberately not an environment variable: the app
    # prints its environment at boot, and a private key in a variable is one
    # log line away from disk.
    volumes:
      - ./gmail-key.json:/app/gmail-key.json:ro
    environment:
      NODE_ENV: production
      # The patients are in India and several checks read the local hour. The
      # image defaults to UTC, which put the "no calls before 7am" rule five
      # and a half hours out.
      TZ: Asia/Kolkata
    # mem_limit, not deploy.resources — the latter is swarm-oriented and is
    # quietly ignored by a plain `docker compose up`.
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login.html').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  uat:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: [.env.uat]
    # The Gmail service-account key lives on the host beside the env files and
    # is mounted read-only. Deliberately not an environment variable: the app
    # prints its environment at boot, and a private key in a variable is one
    # log line away from disk.
    volumes:
      - ./gmail-key.json:/app/gmail-key.json:ro
    environment:
      TZ: Asia/Kolkata
      # Deliberately not "production": resolveDatabaseUrl() only returns the
      # production database when NODE_ENV === 'production', so UAT cannot reach
      # production data even if its env file is wrong.
      NODE_ENV: uat
    # Capped so a runaway test cannot take production down with it. This does
    # not remove the shared-droplet risk, only its most likely cause.
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login.html').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
