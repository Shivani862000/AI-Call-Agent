apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-agent
  namespace: __K8S_NAMESPACE__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: feedback-agent
  template:
    metadata:
      labels:
        app: feedback-agent
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: __APP_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: TZ
              value: "Asia/Kolkata"
            - name: RECORDINGS_DIR
              value: /tmp/feedback-call-recordings
          envFrom:
            - secretRef:
                name: feedback-agent-env
          volumeMounts:
            - name: recording-staging
              mountPath: /tmp/feedback-call-recordings
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        # Scratch space for a recording between saveToFile() and its upload to
        # Supabase Storage. Nothing here needs to outlive the pod.
        - name: recording-staging
          emptyDir: {}
