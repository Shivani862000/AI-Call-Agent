apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedback-agent-ingress
  namespace: __K8S_NAMESPACE__
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - host: __APP_HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: feedback-agent-service
                port:
                  number: 80
