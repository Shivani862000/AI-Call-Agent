apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: feedback-agent-backendconfig
  namespace: __K8S_NAMESPACE__
spec:
  timeoutSec: 3600
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    requestPath: /health
    port: 3000
