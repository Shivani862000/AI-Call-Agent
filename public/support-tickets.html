<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Tickets</title><link rel="stylesheet" href="/app-shell.css"><style>.tickets{padding:24px;max-width:1100px;margin:auto}.ticket{padding:16px;border:1px solid #d9e1e8;border-radius:10px;margin:10px 0}.ticket h3{margin:0 0 6px}.ticket small{color:#52606d}.ticket select,.ticket textarea,.ticket input{width:100%;margin-top:8px;padding:9px}.ticket button{margin-top:8px;padding:9px 14px}</style></head><body><main class="tickets"><h1>Support tickets</h1><p>Review submitted issues and update their status.</p><div id="tickets">Loading…</div></main><script src="/app-shell.js"></script><script>async function load(){const root=document.getElementById('tickets');try{const data=await AppShell.fetchJson('/api/support-tickets');root.innerHTML=data.tickets.map(t=>`<article class="ticket"><h3>${AppShell.escapeHtml(t.ticket_id)} · ${AppShell.escapeHtml(t.description)}</h3><small>${AppShell.escapeHtml(t.status)} · ${AppShell.escapeHtml(t.reporter_username)} · ${AppShell.escapeHtml(t.page_url)}</small><select data-id="${t.ticket_id}"><option ${t.status==='NEW'?'selected':''}>NEW</option><option ${t.status==='IN_PROGRESS'?'selected':''}>IN_PROGRESS</option><option ${t.status==='RESOLVED'?'selected':''}>RESOLVED</option></select><input placeholder="Assignee" value="${AppShell.escapeHtml(t.assignee_username||'')}"><textarea placeholder="Internal update">${AppShell.escapeHtml(t.internal_update||'')}</textarea><textarea placeholder="Resolution note">${AppShell.escapeHtml(t.resolution_note||'')}</textarea><button onclick="save(this)">Save update</button></article>`).join('')||'No tickets yet.'}catch(e){root.textContent=e.message}}async function save(button){const card=button.closest('.ticket');const [status,assigneeUsername,internalUpdate,resolutionNote]=[...card.querySelectorAll('select,input,textarea')].map(e=>e.value);await AppShell.fetchJson('/api/support-tickets/'+card.querySelector('select').dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,assigneeUsername,internalUpdate,resolutionNote})});load()}load()</script></body></html>
