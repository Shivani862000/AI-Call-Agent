<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Analysis</title>
  <link rel="stylesheet" href="/app-shell.css">
</head>
<body class="poc-page feedback-analysis-page">
  <main class="analysis-detail-page">
    <header class="analysis-detail-header">
      <button id="analysisPageBackButton" class="analysis-detail-back" type="button" aria-label="Back to feedback">
        <span aria-hidden="true">&larr;</span>
        <span>Back</span>
      </button>
      <div class="analysis-detail-heading">
        <h1 id="analysisPageTitle">Call Analysis</h1>
        <p id="analysisPageSubtitle">Loading details...</p>
      </div>
    </header>

    <div id="alertContainer" class="alert-stack"></div>

    <section class="analysis-detail-primary">
      <section class="analysis-detail-card">
        <div class="analysis-detail-card-header">
          <h2>Outcome</h2>
          <span id="analysisPageOutcome" class="status-badge pending">--</span>
        </div>
        <div class="analysis-detail-meta-grid">
          <article class="analysis-detail-meta-card">
            <span>Rating</span>
            <strong id="analysisPageRating">--</strong>
          </article>
          <article class="analysis-detail-meta-card">
            <span>Processing</span>
            <strong id="analysisPageStatus">--</strong>
          </article>
        </div>
      </section>

      <section class="analysis-detail-card">
        <h2>Recording</h2>
        <div id="analysisPageRecording" class="analysis-detail-copy">Recording not available yet.</div>
      </section>

      <section class="analysis-detail-card">
        <h2>Summary</h2>
        <div id="analysisPageSummary" class="analysis-detail-copy">Analysis summary not available yet.</div>
      </section>
    </section>

    <details class="details-toggle analysis-detail-toggle" open>
      <summary>Patient Review</summary>
      <div class="details-content">
        <section class="analysis-detail-card analysis-detail-card-nested">
          <div id="analysisPageReview" class="analysis-detail-copy">No review extracted yet.</div>
        </section>
      </div>
    </details>

    <details class="details-toggle analysis-detail-toggle">
      <summary>Full Transcript</summary>
      <div class="details-content">
        <section class="analysis-detail-card analysis-detail-card-nested">
          <div id="analysisPageTranscript" class="analysis-detail-copy">Loading transcript...</div>
        </section>
      </div>
    </details>
  </main>

  <script src="/app-shell.js"></script>
  <script>
    function getCallIdFromLocation() {
      const params = new URLSearchParams(window.location.search);
      return Number(params.get('callId') || 0);
    }

    async function loadTranscriptForCall(callId) {
      try {
        const response = await fetch(`${AppShell.API_BASE}/calls/${callId}/transcript?raw=1`, { cache: 'no-store' });
        if (response.status === 401) {
          AppShell.redirectToLogin();
          throw new Error('Authentication required');
        }
        if (!response.ok) throw new Error('Transcript not available yet');
        return response.text();
      } catch (error) {
        return `Transcript not available yet.\n${error.message}`;
      }
    }

    function renderCallAnalysis(call) {
      document.getElementById('analysisPageTitle').textContent = `Analysis for ${call.customer_name || 'Patient'}`;
      document.getElementById('analysisPageSubtitle').textContent = AppShell.formatDateTime(call.called_at);
      document.getElementById('analysisPageOutcome').textContent = AppShell.formatStatusLabel(call.outcome || '--');
      document.getElementById('analysisPageOutcome').className = `status-badge ${String(call.outcome || 'pending').toLowerCase()}`;
      document.getElementById('analysisPageRating').textContent = call.extracted_rating ? `${call.extracted_rating}/5` : '--';
      document.getElementById('analysisPageStatus').textContent = AppShell.formatStatusLabel(call.analysis_status || 'pending');
      document.getElementById('analysisPageSummary').textContent = call.analysis_summary || call.report_excerpt || 'Analysis summary not available yet.';
      document.getElementById('analysisPageReview').textContent = call.extracted_review_text || 'No review extracted yet.';

      const recordingWrap = document.getElementById('analysisPageRecording');
      if (call.recording_url || call.recording_sid || String(call.recording_status || '').toLowerCase() === 'completed') {
        recordingWrap.innerHTML = `<audio class="audio-player" controls preload="none" src="${AppShell.API_BASE}/calls/${call.id}/recording"></audio>`;
      } else {
        recordingWrap.textContent = 'Recording not available yet.';
      }
    }

    async function loadAnalysisPage() {
      const callId = getCallIdFromLocation();
      if (!callId) {
        throw new Error('Missing call id');
      }

      const call = await AppShell.fetchJson(`${AppShell.API_BASE}/calls/${callId}`);
      renderCallAnalysis(call);
      document.getElementById('analysisPageTranscript').textContent = await loadTranscriptForCall(call.id);
    }

    function goBackToFeedback() {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }
      window.location.href = '/feedback.html';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await AppShell.ensureAuthenticatedSession();
      document.getElementById('analysisPageBackButton').addEventListener('click', goBackToFeedback);

      try {
        await loadAnalysisPage();
      } catch (error) {
        AppShell.showAlert(error.message, 'error');
        document.getElementById('analysisPageSubtitle').textContent = 'Unable to load analysis details.';
        document.getElementById('analysisPageTranscript').textContent = error.message;
      }
    });
  </script>
</body>
</html>
