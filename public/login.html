<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webmaster Login</title>
  <style>
    :root { color-scheme: light; font-family: "Aptos", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #18233f; background: radial-gradient(circle at top left, #dfeaff, transparent 36%), #f3f7ff; }
    main { width: min(100%, 420px); padding: 34px; border: 1px solid rgba(112,144,176,.2); border-radius: 26px; background: rgba(255,255,255,.94); box-shadow: 0 24px 70px rgba(49,78,118,.16); }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { margin: 0 0 26px; color: #6f7e99; line-height: 1.5; }
    label { display: grid; gap: 8px; margin: 16px 0; font-size: 13px; font-weight: 700; }
    input { width: 100%; padding: 14px 16px; border: 1px solid rgba(118,146,182,.3); border-radius: 14px; font: inherit; }
    button { width: 100%; margin-top: 10px; padding: 14px 18px; border: 0; border-radius: 14px; color: white; background: #2d6df6; font: inherit; font-weight: 800; cursor: pointer; }
    #error { min-height: 20px; margin-top: 16px; color: #c93636; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Webmaster login</h1>
    <p>Sign in to manage calls, customers, feedback, and reports.</p>
    <form id="loginForm">
      <label>Username<input id="username" name="username" autocomplete="username" required></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
      <div id="error" role="alert"></div>
    </form>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (response.ok) window.location.replace('/admin.html');
      else error.textContent = 'Invalid username or password';
    });
  </script>
</body>
</html>
