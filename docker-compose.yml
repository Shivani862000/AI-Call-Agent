services:
  app:
    image: ${IMAGE_NAME:-feedback-automation-system:local}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-/app/data/feedback.db}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
    volumes:
      - feedback_data:/app/data
      - feedback_recordings:/tmp/feedback-call-recordings

volumes:
  feedback_data:
  feedback_recordings:
