services:
  app:
    image: ${IMAGE_NAME:-feedback-automation-system:local}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      # Supabase Postgres connection string. No default: the app refuses to
      # boot without it rather than silently writing nowhere.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000

