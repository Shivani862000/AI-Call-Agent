# Runs on every pull request, so branch protection has a check to require.
#
# It targeted "main", a branch this repository does not have -- the default is
# master -- so it had never run on a pull request at all.
name: CI

on:
  pull_request:
    branches: [uat-kcpathlab, master]
  push:
    branches: [uat-kcpathlab, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm test
